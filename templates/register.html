<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .popup {
            position: fixed;
            top: 25px;
            right: 25px;
            background: #16a34a;
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
            z-index: 9999;
        }

        .popup.error {
            background: #dc2626;
        }
    </style>
</head>

<body>

{% if popup_message %}
<div
    class="popup {% if 'exists' in popup_message %}error{% endif %}"
    id="popup"
>
    {{ popup_message }}
</div>
{% endif %}

<div class="auth-container">

    <h2>Create Account</h2>

    <form method="POST" action="/register">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

<script>
    const popup = document.getElementById("popup");

    if (popup) {
        setTimeout(() => {
            popup.style.display = "none";
        }, 3000);
    }
</script>

</body>
</html>
